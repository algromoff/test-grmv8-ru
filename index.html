<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Розыгрыш сайта - ИИ-отдел</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--a1:hsl(265 95% 66%);--a2:hsl(315 95% 62%);--a3:hsl(225 90% 60%)}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:#07070c;color:#f3f1ff;font:400 18px/1.5 Manrope,system-ui,sans-serif;overflow-x:hidden;display:flex;align-items:center;padding:calc(24px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px))}
.aurora{position:fixed;inset:-20vmax;z-index:-1;filter:blur(70px) saturate(140%);opacity:.7}
.aurora i{position:absolute;width:55vmax;height:55vmax;border-radius:50%;mix-blend-mode:screen;animation:drift 22s ease-in-out infinite alternate}
.aurora i:nth-child(1){background:radial-gradient(circle,var(--a1),transparent 62%);top:0;left:0}
.aurora i:nth-child(2){background:radial-gradient(circle,var(--a2),transparent 62%);top:20%;right:0;animation-duration:28s}
.aurora i:nth-child(3){background:radial-gradient(circle,var(--a3),transparent 62%);bottom:0;left:25%;animation-duration:32s}
@keyframes drift{50%{transform:translate(8vmax,-6vmax) scale(1.15)}100%{transform:translate(-6vmax,7vmax) scale(.95)}}
.box{max-width:1180px;margin:0 auto;width:100%;display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:center}
.tag{display:inline-block;padding:8px 16px;border:1px solid rgba(255,255,255,.14);border-radius:999px;background:rgba(255,255,255,.06);color:#c9c5e3;font-size:14px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:26px}
h1{font:800 clamp(40px,6vw,86px)/1.04 Unbounded,sans-serif;margin-bottom:26px}
.grad{background:linear-gradient(100deg,var(--a1),var(--a2),var(--a3),var(--a1));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 8s linear infinite}
@keyframes flow{to{background-position:300% 0}}
p{font-size:clamp(18px,2vw,24px);color:#d6d3ec;max-width:30ch}
ol{margin-top:30px;list-style:none;display:grid;gap:12px;counter-reset:s}
li{counter-increment:s;display:flex;gap:14px;align-items:center;font-size:clamp(16px,1.6vw,20px);color:#e6e3f6}
li:before{content:counter(s);flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:800 15px Unbounded,sans-serif;background:linear-gradient(120deg,var(--a1),var(--a2));color:#0b0b12}
.qrwrap{position:relative;justify-self:center;width:min(440px,100%)}
.qrwrap:before{content:"";position:absolute;inset:-4px;border-radius:36px;background:conic-gradient(from var(--ang),var(--a1),var(--a2),var(--a3),var(--a1));animation:ang 6s linear infinite;filter:blur(1px)}
.qrwrap:after{content:"";position:absolute;inset:-4px;border-radius:36px;background:conic-gradient(from var(--ang),var(--a1),var(--a2),var(--a3),var(--a1));animation:ang 6s linear infinite;filter:blur(40px);opacity:.75;z-index:-1}
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes ang{to{--ang:360deg}}
.qr{position:relative;z-index:1;background:#fff;border-radius:32px;padding:26px;overflow:hidden}
.qr img{display:block;width:100%;height:auto}
.cap{position:relative;z-index:1;text-align:center;margin-top:22px;color:#c9c5e3;font-size:15px}
.cap a{color:#fff}
@media (max-width:860px){.box{grid-template-columns:1fr;gap:40px}.qrwrap{width:min(340px,100%)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="aurora"><i></i><i></i><i></i></div>
<main class="box">
  <div>
    <div class="tag">Прямо сейчас, в этом зале</div>
    <h1>Разыгрываем <span class="grad">сайт за 10 минут</span></h1>
    <p>ИИ-отдел соберёт его при вас: с вашим фото, текстами и кнопкой записи.</p>
    <ol>
      <li>Наведите камеру на код</li>
      <li>Нажмите «Старт» в боте</li>
      <li>Вы в розыгрыше, а книга «Как не потерять аккаунт Instagram» уже у вас</li>
    </ol>
  </div>
  <div class="qrwrap">
    <div class="qr"><img src="qr.svg" alt="QR-код на бота"></div>
    <div class="cap">или <a href="https://t.me/Lucky_Anni_bot?start=guide_insta">t.me/Lucky_Anni_bot</a></div>
  </div>
</main>
</body>
</html>
